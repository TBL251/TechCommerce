name: CI - Test & Build Verification

on:
  pull_request:
    branches: [ "develop" ]
  push:
    branches: [ "develop" ]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  verify:
    name: Maven Test & Docker Build Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: techcommerce
          POSTGRES_USER: techcommerce
          POSTGRES_PASSWORD: techcommerce_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techcommerce -d techcommerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout -f FETCH_HEAD

      - name: Run unit and integration tests on H2 & PostgreSQL 16 (JDK 17)
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          chmod +x mvnw
          ./mvnw -B verify
          ./mvnw -B test \
            -Dspring.datasource.url=jdbc:postgresql://localhost:5432/techcommerce \
            -Dspring.datasource.username=techcommerce \
            -Dspring.datasource.password=techcommerce_dev \
            -Dspring.datasource.driver-class-name=org.postgresql.Driver \
            -Dspring.flyway.url=jdbc:postgresql://localhost:5432/techcommerce \
            -Dspring.flyway.user=techcommerce \
            -Dspring.flyway.password=techcommerce_dev

      - name: Verify production Docker image build
        run: |
          docker build -t techcommerce:ci .

  promote-to-main:
    name: Auto-Merge develop to main (PR)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.merge.outputs.merged }}

    steps:
      - name: Create and merge Pull Request (develop -> main)
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Check if develop has commits ahead of main
          COMPARE=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/compare/main...develop")
          AHEAD=$(echo "$COMPARE" | jq -r '.ahead_by')
          if [ "$AHEAD" = "0" ]; then
            echo "develop is already in sync with main. Skipping merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find existing open PR develop -> main or create a new one
          PR_NUM=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls?state=open&head=${REPO%%/*}:develop&base=main" \
            | jq -r '.[0].number // empty')

          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls" \
              -d '{"title":"chore(release): auto-merge develop into main","head":"develop","base":"main","body":"CI passed (Maven Test & Docker Build Check). Auto-merged from develop."}' \
              | jq -r '.number')
          fi

          echo "Merging PR #$PR_NUM (develop -> main)..."
          curl -fsSL -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUM/merge" \
            -d '{"merge_method":"merge"}'
          echo "merged=true" >> "$GITHUB_OUTPUT"

  deploy-production:
    name: Trigger CD Build & Deploy
    needs: promote-to-main
    if: needs.promote-to-main.outputs.merged == 'true'
    uses: ./.github/workflows/cd.yml
    secrets: inherit

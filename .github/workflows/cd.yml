name: CD - Build Image & Deploy to Self-Hosted Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout -f FETCH_HEAD

      - name: Run test suite before publishing (JDK 17)
        run: |
          if [ -n "$JAVA_HOME_17_X64" ]; then
            export JAVA_HOME="$JAVA_HOME_17_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
          fi
          chmod +x mvnw
          ./mvnw -B test

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker build \
            -t ghcr.io/tbl251/techcommerce:latest \
            -t ghcr.io/tbl251/techcommerce:${{ github.sha }} \
            .
          docker push ghcr.io/tbl251/techcommerce:latest
          docker push ghcr.io/tbl251/techcommerce:${{ github.sha }}

  deploy:
    name: Deploy to Self-Hosted Server (techcommerce.store)
    needs: build-and-push
    if: vars.ENABLE_SELF_HOSTED_DEPLOY == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Sync production compose files
        shell: powershell
        run: |
          Copy-Item "e:\TechCommerce\docker-compose.prod.yml" -Destination "$PWD\docker-compose.prod.yml" -Force
          New-Item -ItemType Directory -Force -Path "$PWD\docker\nginx" | Out-Null
          Copy-Item "e:\TechCommerce\docker\nginx\default.conf" -Destination "$PWD\docker\nginx\default.conf" -Force

      - name: Log in to GitHub Container Registry (GHCR)
        shell: powershell
        run: |
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate .env.prod from GitHub Secrets
        shell: powershell
        run: |
          $lines = @(
            "APP_IMAGE=ghcr.io/tbl251/techcommerce:${{ github.sha }}",
            "APP_PUBLIC_URL=https://techcommerce.store",
            "DB_URL=${{ secrets.DB_URL }}",
            "DB_USERNAME=${{ secrets.DB_USERNAME }}",
            "DB_PASSWORD=${{ secrets.DB_PASSWORD }}",
            "FLYWAY_URL=${{ secrets.FLYWAY_URL }}",
            "JWT_SECRET=${{ secrets.JWT_SECRET }}",
            "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}",
            "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}",
            "MAIL_HOST=${{ secrets.MAIL_HOST }}",
            "MAIL_PORT=${{ secrets.MAIL_PORT }}",
            "MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}",
            "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}",
            "MAIL_FROM=${{ secrets.MAIL_FROM }}",
            "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}",
            "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}",
            "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}",
            "VNPAY_TMN_CODE=${{ secrets.VNPAY_TMN_CODE }}",
            "VNPAY_HASH_SECRET=${{ secrets.VNPAY_HASH_SECRET }}",
            "VNPAY_RETURN_URL=https://techcommerce.store/payments/vnpay/return",
            "CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}"
          )
          [System.IO.File]::WriteAllLines((Join-Path $PWD ".env.prod"), $lines)

      - name: Pull image and restart production stack
        shell: powershell
        run: |
          docker compose -p techcommerce-prod -f docker-compose.prod.yml --env-file .env.prod pull app
          docker compose -p techcommerce-prod -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans

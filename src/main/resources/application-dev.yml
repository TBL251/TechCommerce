spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techcommerce}
    username: ${DB_USERNAME:techcommerce}
    password: ${DB_PASSWORD:techcommerce_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  flyway:
    url: ${FLYWAY_URL:${DB_URL:jdbc:postgresql://localhost:5432/techcommerce}}
    user: ${DB_USERNAME:techcommerce}
    password: ${DB_PASSWORD:techcommerce_dev}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

app:
  seed-demo-data: true


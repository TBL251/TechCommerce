<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 132" width="100%" role="img" aria-label="TECHCOMMERCE">
  <defs>
    <!-- Full-Width Animated RGB Chroma Spectrum (userSpaceOnUse across all 12 letters) -->
    <linearGradient id="rgbChroma" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1100" y2="110">
      <stop offset="0%" stop-color="#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#a855f7;#ff007f;#00ffa3;#00f5ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#ff007f;#00ffa3;#00f5ff;#3b82f6" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00ffa3;#00f5ff;#3b82f6;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#00f5ff;#3b82f6;#a855f7;#ff007f" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00ffa3">
        <animate attributeName="stop-color" values="#00ffa3;#3b82f6;#a855f7;#ff007f;#00ffa3" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Vertical Chrome Specular Overlay (Bright Top Edge -> Rich Mid -> Deep Base) -->
    <linearGradient id="chromeSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="26%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Custom Cyber-Blade Futuristic Letterforms with Floating Energy Cores (Height = 106) -->
    <!-- T: Swept Wing Top Blade + Detached Floating Vertical Pillar -->
    <path id="CB_T" d="M 0 18 L 18 0 L 76 0 L 60 18 Z M 27 25 L 47 25 L 47 88 L 27 106 Z"/>

    <!-- E: Angular Blade Spine + Floating Diamond-Tipped Center Energy Core -->
    <path id="CB_E" d="M 0 18 L 18 0 L 70 0 L 54 18 L 19 18 L 19 88 L 56 88 L 70 106 L 14 106 L 0 92 Z M 26 44 L 58 44 L 67 53 L 58 62 L 26 62 Z"/>

    <!-- C: Swept Cyber-Blade C with Razor 45-Deg Terminals -->
    <path id="CB_C" d="M 20 0 L 70 0 L 54 18 L 25 18 L 19 24 L 19 82 L 25 88 L 56 88 L 70 106 L 16 106 L 0 90 L 0 20 Z"/>

    <!-- H: Twin Blade Pillars + Floating Detached Central Energy Bridge -->
    <path id="CB_H" d="M 0 16 L 19 0 L 19 106 L 0 90 Z M 53 16 L 72 0 L 72 90 L 53 106 Z M 25 44 L 47 44 L 47 62 L 25 62 Z"/>

    <!-- O: Split-Blade Futuristic Ring (Left & Right Interlocking Cyber Blades) -->
    <path id="CB_O" d="M 20 0 L 52 0 L 36 18 L 25 18 L 19 24 L 19 82 L 28 88 L 14 106 L 0 92 L 0 20 Z M 58 0 L 72 14 L 72 86 L 52 106 L 20 106 L 36 88 L 47 88 L 53 82 L 53 24 L 44 18 Z"/>

    <!-- M: Twin Outer Cyber Wings + Floating Suspended Center V-Blade -->
    <path id="CB_M" d="M 0 18 L 18 0 L 30 0 L 43 26 L 33 42 L 19 18 L 19 106 L 0 90 Z M 56 0 L 70 0 L 88 18 L 88 90 L 69 106 L 69 18 L 44 64 L 35 48 Z"/>

    <!-- R: Blade Spine + Detached Floating Upper Hood & Razor Diagonal Kick-Leg -->
    <path id="CB_R" d="M 0 16 L 19 0 L 19 106 L 0 90 Z M 25 0 L 56 0 L 72 16 L 72 44 L 54 58 L 74 106 L 53 106 L 35 62 L 25 62 L 25 44 L 49 44 L 54 39 L 54 22 L 49 18 L 25 18 Z"/>

    <!-- Full Wordmark Assembly: T E C H  //  C O M M E R C E -->
    <g id="cyberWordmark">
      <!-- TECH -->
      <use href="#CB_T" x="22" y="10"/>
      <use href="#CB_E" x="106" y="10"/>
      <use href="#CB_C" x="188" y="10"/>
      <use href="#CB_H" x="270" y="10"/>

      <!-- Futuristic Dual-Blade Energy Slash Separator -->
      <polygon points="354,96 368,24 373,24 359,96"/>
      <polygon points="362,104 376,32 381,32 367,104"/>

      <!-- COMMERCE -->
      <use href="#CB_C" x="392" y="10"/>
      <use href="#CB_O" x="474" y="10"/>
      <use href="#CB_M" x="558" y="10"/>
      <use href="#CB_M" x="658" y="10"/>
      <use href="#CB_E" x="758" y="10"/>
      <use href="#CB_R" x="840" y="10"/>
      <use href="#CB_C" x="926" y="10"/>
      <use href="#CB_E" x="1008" y="10"/>
    </g>
  </defs>

  <!-- Forward Cyber-Blade Speed Slant (-6 deg) -->
  <g transform="translate(10, 2) skewX(-6)">

    <!-- CHROMATIC LAYER 1: Upper-Left Neon Cyan 3D Split Echo (-3.5px, -3px) -->
    <use href="#cyberWordmark" transform="translate(-3.5, -3)" fill="none" stroke="#00f5ff" stroke-width="1.4" stroke-opacity="0.72"/>

    <!-- CHROMATIC LAYER 2: Lower-Right Laser Magenta 3D Split Echo (+9.5px, +9.5px) -->
    <use href="#cyberWordmark" transform="translate(9.5, 9.5)" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-opacity="0.72"/>

    <!-- CHROMATIC LAYER 3: Mid 3D Dark Obsidian Chassis Extrusion (+4.5px, +4.5px) -->
    <use href="#cyberWordmark" transform="translate(4.5, 4.5)" fill="#070312" stroke="url(#rgbChroma)" stroke-width="1.5" stroke-opacity="0.88"/>

    <!-- LAYER 4: Main Animated RGB Chroma Cyber-Blade Faces (0, 0) -->
    <use href="#cyberWordmark" fill="url(#rgbChroma)"/>

    <!-- LAYER 5: Metallic Chrome Specular Sheen & Crisp White Rim (0, 0) -->
    <use href="#cyberWordmark" fill="url(#chromeSheen)" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.82"/>
  </g>
</svg>

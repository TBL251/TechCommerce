<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 126" width="100%" role="img" aria-label="TECHCOMMERCE">
  <defs>
    <!-- ROG / Hardware Metallic Sapphire Gradient for TECH -->
    <linearGradient id="techStencil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- Cyber Emerald / Titanium Gradient for COMMERCE -->
    <linearGradient id="commStencil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="52%" stop-color="#059669"/>
      <stop offset="85%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Angular Hardware Letter Primitives (Height = 104) -->
    <path id="L_T" d="M 10 0 L 72 0 L 66 20 L 46 20 L 46 94 L 34 104 L 24 104 L 24 20 L 0 20 Z"/>
    <path id="L_E" d="M 14 0 L 68 0 L 60 19 L 21 19 L 21 42 L 57 42 L 49 61 L 21 61 L 21 85 L 62 85 L 68 104 L 10 104 L 0 94 L 0 14 Z"/>
    <path id="L_C" d="M 16 0 L 58 0 L 68 10 L 68 29 L 47 29 L 47 19 L 21 19 L 21 85 L 47 85 L 47 75 L 68 75 L 68 92 L 56 104 L 12 104 L 0 92 L 0 16 Z"/>
    <path id="L_H" d="M 0 10 L 10 0 L 21 0 L 21 42 L 51 42 L 51 0 L 62 0 L 72 10 L 72 94 L 62 104 L 51 104 L 51 61 L 21 61 L 21 104 L 10 104 L 0 94 Z"/>
    <path id="L_O" fill-rule="evenodd" d="M 16 0 L 58 0 L 72 14 L 72 90 L 56 104 L 14 104 L 0 90 L 0 16 Z M 26 19 L 46 19 L 51 24 L 51 80 L 46 85 L 26 85 L 21 80 L 21 24 Z"/>
    <path id="L_M" d="M 0 12 L 12 0 L 23 0 L 43 38 L 63 0 L 74 0 L 86 12 L 86 104 L 65 104 L 65 36 L 47 70 L 39 70 L 21 36 L 21 104 L 0 104 Z"/>
    <path id="L_R" fill-rule="evenodd" d="M 14 0 L 56 0 L 70 14 L 70 46 L 55 60 L 72 104 L 49 104 L 35 62 L 21 62 L 21 104 L 0 104 L 0 14 Z M 21 19 L 46 19 L 50 23 L 50 38 L 46 42 L 21 42 Z"/>

    <!-- Group 1: TECH -->
    <g id="wordTech">
      <use href="#L_T" x="22" y="6"/>
      <use href="#L_E" x="108" y="6"/>
      <use href="#L_C" x="190" y="6"/>
      <use href="#L_H" x="272" y="6"/>
    </g>

    <!-- Group 2: COMMERCE -->
    <g id="wordCommerce">
      <use href="#L_C" x="378" y="6"/>
      <use href="#L_O" x="460" y="6"/>
      <use href="#L_M" x="546" y="6"/>
      <use href="#L_M" x="646" y="6"/>
      <use href="#L_E" x="746" y="6"/>
      <use href="#L_R" x="828" y="6"/>
      <use href="#L_C" x="914" y="6"/>
      <use href="#L_E" x="996" y="6"/>
    </g>

    <!-- Industrial ROG Stencil Cut Mask (Black = Cut Away Gaps) -->
    <mask id="stencilCuts">
      <rect x="-40" y="-20" width="1160" height="160" fill="#ffffff"/>
      <!-- Precision Horizontal Laser Micro-Slot across Midline -->
      <rect x="0" y="55" width="1100" height="3.2" fill="#000000"/>
      <!-- 45-Degree Industrial Stencil Slashes across Each Character Stem -->
      <g stroke="#000000" stroke-width="4.2" stroke-linecap="square">
        <!-- T -->
        <line x1="36" y1="30" x2="76" y2="-10"/>
        <line x1="38" y1="88" x2="72" y2="54"/>
        <!-- E -->
        <line x1="100" y1="44" x2="136" y2="8"/>
        <line x1="126" y1="116" x2="164" y2="78"/>
        <!-- C -->
        <line x1="184" y1="46" x2="220" y2="10"/>
        <line x1="208" y1="116" x2="246" y2="78"/>
        <!-- H -->
        <line x1="266" y1="42" x2="302" y2="6"/>
        <line x1="314" y1="96" x2="352" y2="58"/>
        <!-- C -->
        <line x1="372" y1="46" x2="408" y2="10"/>
        <line x1="396" y1="116" x2="434" y2="78"/>
        <!-- O -->
        <line x1="454" y1="42" x2="490" y2="6"/>
        <line x1="498" y1="108" x2="540" y2="66"/>
        <!-- M1 -->
        <line x1="540" y1="46" x2="576" y2="10"/>
        <line x1="598" y1="104" x2="640" y2="62"/>
        <!-- M2 -->
        <line x1="640" y1="46" x2="676" y2="10"/>
        <line x1="698" y1="104" x2="740" y2="62"/>
        <!-- E -->
        <line x1="740" y1="44" x2="776" y2="8"/>
        <line x1="766" y1="116" x2="804" y2="78"/>
        <!-- R -->
        <line x1="822" y1="42" x2="858" y2="6"/>
        <line x1="864" y1="96" x2="906" y2="54"/>
        <!-- C -->
        <line x1="908" y1="46" x2="944" y2="10"/>
        <line x1="932" y1="116" x2="970" y2="78"/>
        <!-- E -->
        <line x1="990" y1="44" x2="1026" y2="8"/>
        <line x1="1016" y1="116" x2="1054" y2="78"/>
      </g>
    </mask>

    <!-- Clip Paths to Confine PCB Circuit Traces Strictly Inside the Letter Bodies -->
    <clipPath id="clipTech">
      <use href="#wordTech"/>
    </clipPath>
    <clipPath id="clipComm">
      <use href="#wordCommerce"/>
    </clipPath>
  </defs>

  <!-- Forward Speed Slant (-7 deg) for Hardware / ROG Stencil Aesthetic -->
  <g transform="translate(12, 2) skewX(-7)">

    <!-- LAYER 1: Deep 3D Wireframe Echo (+9px, +9px) -->
    <use href="#wordTech" transform="translate(9, 9)" fill="none" stroke="#1d4ed8" stroke-width="1.3" stroke-opacity="0.5"/>
    <use href="#wordCommerce" transform="translate(9, 9)" fill="none" stroke="#047857" stroke-width="1.3" stroke-opacity="0.5"/>

    <!-- LAYER 2: Solid 3D Chassis Extrusion (+4.5px, +4.5px) -->
    <use href="#wordTech" transform="translate(4.5, 4.5)" fill="#081226" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.8"/>
    <use href="#wordCommerce" transform="translate(4.5, 4.5)" fill="#041f18" stroke="#34d399" stroke-width="1.4" stroke-opacity="0.8"/>

    <!-- LAYER 3: Main Stencil-Cut Metallic Letter Faces + Internal PCB Traces -->
    <g mask="url(#stencilCuts)">
      <!-- Main Metallic Faces -->
      <use href="#wordTech" fill="url(#techStencil)" stroke="#e0f2fe" stroke-width="0.9"/>
      <use href="#wordCommerce" fill="url(#commStencil)" stroke="#d1fae5" stroke-width="0.9"/>

      <!-- Internal PCB Circuit Traces & IC Pads inside TECH -->
      <g clip-path="url(#clipTech)" stroke="#bae6fd" stroke-width="1.6" fill="#0284c7" opacity="0.88">
        <path d="M 20 18 L 48 18 L 58 28 L 58 92 M 108 26 L 120 38 L 120 82 L 154 82 M 190 34 L 204 48 L 204 88 L 238 88 M 272 22 L 284 34 L 284 74 L 334 74 L 334 98" fill="none"/>
        <circle cx="58" cy="28" r="2.8"/>
        <circle cx="58" cy="76" r="2.8"/>
        <circle cx="120" cy="38" r="2.8"/>
        <circle cx="154" cy="82" r="2.8"/>
        <circle cx="204" cy="48" r="2.8"/>
        <circle cx="238" cy="88" r="2.8"/>
        <circle cx="284" cy="34" r="2.8"/>
        <circle cx="334" cy="74" r="2.8"/>
      </g>

      <!-- Internal PCB Circuit Traces & IC Pads inside COMMERCE -->
      <g clip-path="url(#clipComm)" stroke="#a7f3d0" stroke-width="1.6" fill="#047857" opacity="0.88">
        <path d="M 378 30 L 392 44 L 392 88 L 426 88 M 460 28 L 474 42 L 474 86 L 516 86 L 524 78 L 524 30 M 546 96 L 560 82 L 560 32 L 588 60 L 618 30 L 618 90 M 646 96 L 660 82 L 660 32 L 688 60 L 718 30 L 718 90 M 746 26 L 758 38 L 758 84 L 796 84 M 828 24 L 842 38 L 842 94 M 856 54 L 888 96 M 914 32 L 928 46 L 928 88 L 964 88 M 996 26 L 1008 38 L 1008 86 L 1048 86" fill="none"/>
        <circle cx="392" cy="44" r="2.8"/>
        <circle cx="426" cy="88" r="2.8"/>
        <circle cx="474" cy="42" r="2.8"/>
        <circle cx="524" cy="78" r="2.8"/>
        <circle cx="560" cy="82" r="2.8"/>
        <circle cx="588" cy="60" r="2.8"/>
        <circle cx="618" cy="82" r="2.8"/>
        <circle cx="660" cy="82" r="2.8"/>
        <circle cx="688" cy="60" r="2.8"/>
        <circle cx="718" cy="82" r="2.8"/>
        <circle cx="758" cy="38" r="2.8"/>
        <circle cx="796" cy="84" r="2.8"/>
        <circle cx="842" cy="38" r="2.8"/>
        <circle cx="888" cy="96" r="2.8"/>
        <circle cx="928" cy="46" r="2.8"/>
        <circle cx="964" cy="88" r="2.8"/>
        <circle cx="1008" cy="38" r="2.8"/>
        <circle cx="1048" cy="86" r="2.8"/>
      </g>
    </g>

    <!-- Center ROG Slash Divider between TECH and COMMERCE -->
    <polygon points="357,96 367,18 373,18 363,96" fill="#38bdf8" opacity="0.85"/>
    <polygon points="364,96 374,18 378,18 368,96" fill="#34d399" opacity="0.85"/>
  </g>
</svg>

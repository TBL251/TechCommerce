<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" role="img" aria-label="TechCommerce - Hệ thống Thương mại Điện tử Chuỗi Cửa hàng Công nghệ Đa Chi nhánh">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#68dba9"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d59c1"/>
      <stop offset="100%" stop-color="#0f52ba"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#68dba9" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0f52ba" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f52ba" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#006545" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#006545" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Card Base -->
  <rect x="2" y="2" width="956" height="226" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="956" height="226" rx="22" fill="url(#grid)"/>
  <rect x="2" y="2" width="956" height="226" rx="22" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="956" height="226" rx="22" fill="url(#glowRight)"/>

  <!-- Top Live Status Pill -->
  <g transform="translate(360, 24)">
    <rect x="0" y="0" width="240" height="26" rx="13" fill="#1e293b" fill-opacity="0.75" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#68dba9"/>
    <text x="28" y="17" fill="#cbd5e1" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11" font-weight="600" letter-spacing="0.6">MULTI-STORE · 3 SHOWROOMS</text>
  </g>

  <!-- Brand Icon + Wordmark Group -->
  <g transform="translate(195, 66)">
    <!-- Sapphire Memory Chip Icon -->
    <rect x="0" y="2" width="64" height="64" rx="16" fill="url(#chipGrad)" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Chip Pins & Core -->
    <rect x="18" y="20" width="28" height="28" rx="6" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <rect x="25" y="27" width="14" height="14" rx="3" fill="#68dba9"/>
    <path d="M26 12v8M38 12v8M26 48v8M38 48v8M10 28h8M10 40h8M46 28h8M46 40h8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- TechCommerce Title -->
    <text x="84" y="52" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.2">
      <tspan fill="#ffffff">Tech</tspan><tspan fill="url(#brandGrad)">Commerce</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <text x="480" y="156" text-anchor="middle" fill="#94a3b8" font-family="'Be Vietnam Pro', 'Segoe UI', -apple-system, sans-serif" font-size="14.5" font-weight="500" letter-spacing="0.3">
    Hệ thống Thương mại Điện tử Chuỗi Cửa hàng Công nghệ Đa Chi nhánh
  </text>

  <!-- Branch & Tech Pills Row -->
  <g transform="translate(226, 176)" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="154" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="14" cy="14" r="3.5" fill="#60a5fa"/>
    <text x="25" y="18" fill="#e2e8f0">HN-01 · Hà Nội</text>

    <rect x="166" y="0" width="162" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="180" cy="14" r="3.5" fill="#68dba9"/>
    <text x="191" y="18" fill="#e2e8f0">HCM-01 · TP.HCM</text>

    <rect x="340" y="0" width="168" height="28" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="354" cy="14" r="3.5" fill="#38bdf8"/>
    <text x="365" y="18" fill="#e2e8f0">DN-01 · Đà Nẵng</text>
  </g>
</svg>

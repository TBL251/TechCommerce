<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 124" width="100%" role="img" aria-label="TECHCOMMERCE">
  <defs>
    <!-- 4-Tier Stepped Chamfered Gradient for TECH (Ice -> Cyan -> Sapphire -> Deep Cobalt) -->
    <linearGradient id="techFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="28%" stop-color="#7dd3fc"/>
      <stop offset="28.5%" stop-color="#38bdf8"/>
      <stop offset="64%" stop-color="#2563eb"/>
      <stop offset="64.5%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f3380"/>
    </linearGradient>

    <!-- 4-Tier Stepped Chamfered Gradient for COMMERCE (Mint Ice -> Emerald -> Teal -> Deep Jade) -->
    <linearGradient id="commFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="28%" stop-color="#6ee7b7"/>
      <stop offset="28.5%" stop-color="#34d399"/>
      <stop offset="64%" stop-color="#10b981"/>
      <stop offset="64.5%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Reusable 45-Degree Chamfered Letter Primitives (Height = 104) -->
    <path id="L_T" d="M 10 0 L 62 0 L 72 10 L 72 20 L 46 20 L 46 94 L 36 104 L 26 104 L 26 20 L 0 20 L 0 10 Z"/>
    <path id="L_E" d="M 12 0 L 68 0 L 60 20 L 20 20 L 20 42 L 56 42 L 48 62 L 20 62 L 20 84 L 60 84 L 68 104 L 12 104 L 0 92 L 0 12 Z"/>
    <path id="L_C" d="M 14 0 L 56 0 L 68 12 L 68 28 L 48 28 L 48 20 L 20 20 L 20 84 L 48 84 L 48 76 L 68 76 L 68 92 L 56 104 L 14 104 L 0 90 L 0 14 Z"/>
    <path id="L_H" d="M 0 10 L 10 0 L 20 0 L 20 42 L 52 42 L 52 0 L 62 0 L 72 10 L 72 94 L 62 104 L 52 104 L 52 62 L 20 62 L 20 104 L 10 104 L 0 94 Z"/>
    <path id="L_O" fill-rule="evenodd" d="M 14 0 L 58 0 L 72 14 L 72 90 L 58 104 L 14 104 L 0 90 L 0 14 Z M 26 20 L 46 20 L 52 26 L 52 78 L 46 84 L 26 84 L 20 78 L 20 26 Z"/>
    <path id="L_M" d="M 0 12 L 12 0 L 22 0 L 43 38 L 64 0 L 74 0 L 86 12 L 86 104 L 66 104 L 66 36 L 47 70 L 39 70 L 20 36 L 20 104 L 0 104 Z"/>
    <path id="L_R" fill-rule="evenodd" d="M 12 0 L 56 0 L 70 14 L 70 46 L 56 60 L 72 104 L 50 104 L 36 62 L 20 62 L 20 104 L 0 104 L 0 12 Z M 20 20 L 46 20 L 50 24 L 50 38 L 46 42 L 20 42 Z"/>

    <!-- Group 1: TECH -->
    <g id="wordTech">
      <use href="#L_T" x="8" y="4"/>
      <use href="#L_E" x="94" y="4"/>
      <use href="#L_C" x="176" y="4"/>
      <use href="#L_H" x="258" y="4"/>
    </g>

    <!-- Group 2: COMMERCE -->
    <g id="wordCommerce">
      <use href="#L_C" x="362" y="4"/>
      <use href="#L_O" x="444" y="4"/>
      <use href="#L_M" x="530" y="4"/>
      <use href="#L_M" x="630" y="4"/>
      <use href="#L_E" x="730" y="4"/>
      <use href="#L_R" x="812" y="4"/>
      <use href="#L_C" x="898" y="4"/>
      <use href="#L_E" x="980" y="4"/>
    </g>
  </defs>

  <!-- PASS 1: Outer 3D Wireframe Echo (+10px, +10px) -->
  <use href="#wordTech" transform="translate(10, 10)" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-opacity="0.6"/>
  <use href="#wordCommerce" transform="translate(10, 10)" fill="none" stroke="#047857" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- PASS 2: Inner 3D Wireframe Echo (+5px, +5px) -->
  <use href="#wordTech" transform="translate(5, 5)" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-opacity="0.8"/>
  <use href="#wordCommerce" transform="translate(5, 5)" fill="none" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.8"/>

  <!-- PASS 3: Main Chamfered Silicon Faces (0, 0) -->
  <use href="#wordTech" fill="url(#techFace)" stroke="#bae6fd" stroke-width="0.9" stroke-opacity="0.75"/>
  <use href="#wordCommerce" fill="url(#commFace)" stroke="#a7f3d0" stroke-width="0.9" stroke-opacity="0.75"/>
</svg>
